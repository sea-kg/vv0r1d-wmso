<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель | Редактор комнат</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/canvas.css">
</head>
<body>
  <div class="app" id="appContainer" hidden>

    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🏗️ Комнаты <span class="count" id="roomCount">0</span></h1>
      </div>
      <div class="sidebar-search">
        <input type="text" id="roomSearch" placeholder="🔍 Поиск комнаты...">
      </div>
      <div class="room-list" id="roomList"></div>
      <div class="sidebar-footer">
        <button class="btn btn-block" id="createRoomBtn">➕ Новая комната</button>
      </div>
    </aside>

    <header class="header">
      <div class="header-left">
        <div class="header-title">
          Редактор <span id="headerRoomName">— комната не выбрана</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" id="logoutBtn">🚪 Выйти</button>
      </div>
    </header>

    <main class="editor">
      <div class="toolbar">
        <div class="toolbar-group">
          <button class="tool-btn active" data-tool="wall">🧱 Стена</button>
          <button class="tool-btn" data-tool="floor">⬜ Пол</button>
          <button class="tool-btn" data-tool="erase">🧽 Ластик</button>
        </div>
        <div class="toolbar-divider"></div>
        <button class="btn btn-secondary btn-sm" id="clearRoomBtn">🗑️ Очистить</button>
        <button class="btn btn-secondary btn-sm" id="fillRoomBtn">▦ Заполнить</button>
        <div class="toolbar-divider"></div>
        <button class="btn btn-success btn-sm" id="saveRoomBtn">💾 Сохранить</button>
      </div>

      <div class="workspace">
        <aside class="inspector">
          <!-- Параметры комнаты -->
          <div class="inspector-section">
            <div class="inspector-title">⚙️ Параметры комнаты</div>
            <div class="field field-row single" style="margin-bottom: 10px;">
              <label>Название</label>
              <input type="text" id="roomNameInput" placeholder="Название комнаты">
            </div>
            <div class="field-row">
              <div class="field">
                <label>Ширина (клеток)</label>
                <input type="number" id="roomWidthInput" min="3" max="100" value="15">
              </div>
              <div class="field">
                <label>Высота (клеток)</label>
                <input type="number" id="roomHeightInput" min="3" max="100" value="10">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>Начало X</label>
                <input type="number" id="roomStartX" min="0" value="0" disabled>
              </div>
              <div class="field">
                <label>Начало Y</label>
                <input type="number" id="roomStartY" min="0" value="0" disabled>
              </div>
            </div>

            <div style="margin-top: 10px;">
              <label style="font-size:0.72rem; color:#94a3b8; font-weight:500;">Быстрые размеры:</label>
              <div class="preset-chips" id="presetChips">
                <span class="chip" data-w="8" data-h="6">8×6</span>
                <span class="chip active" data-w="15" data-h="10">15×10</span>
                <span class="chip" data-w="20" data-h="15">20×15</span>
                <span class="chip" data-w="30" data-h="20">30×20</span>
              </div>
            </div>

            <button class="btn btn-block" id="applySizeBtn" style="margin-top: 14px;">📐 Применить размеры</button>
          </div>

          <!-- Статистика -->
          <div class="inspector-section">
            <div class="inspector-title">📊 Статистика</div>
            <div class="stats">
              <div class="stat">
                <div class="label">Клеток всего</div>
                <div class="value" id="statTotal">0</div>
              </div>
              <div class="stat">
                <div class="label">Стен</div>
                <div class="value walls" id="statWalls">0</div>
              </div>
              <div class="stat">
                <div class="label">Пол</div>
                <div class="value floor" id="statFloor">0</div>
              </div>
              <div class="stat">
                <div class="label">Заполнено</div>
                <div class="value" id="statPercent">0%</div>
              </div>
            </div>
          </div>

          <!-- Координаты клетки -->
          <div class="inspector-section">
            <div class="inspector-title">🎯 Координаты клетки</div>
            <div class="field-row">
              <div class="field">
                <label>X (столбец)</label>
                <input type="number" id="cellX" min="0" value="0" disabled>
              </div>
              <div class="field">
                <label>Y (строка)</label>
                <input type="number" id="cellY" min="0" value="0" disabled>
              </div>
            </div>
            <div class="field single">
              <label>Тип клетки</label>
              <input type="text" id="cellType" value="—" disabled>
            </div>
            <div style="font-size: 0.72rem; color:#64748b; margin-top: 10px;">
              💡 Зажмите ЛКМ и ведите, чтобы рисовать линию
            </div>
          </div>
        </aside>

        <div class="canvas-area" id="canvasArea">
          <div class="canvas-container">
            <canvas id="roomCanvas" width="600" height="400"></canvas>
            <div class="coord-hint" id="coordHint">0, 0</div>
          </div>

          <div class="empty-state hidden" id="emptyState">
            <div class="icon">🏗️</div>
            <p>Нет выбранной комнаты</p>
            <button class="btn" id="emptyCreateBtn">➕ Создать первую комнату</button>
          </div>

          <div id="canvasSpinner" class="spinner-overlay hidden">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <h2>Admin log-in</h2>
      <div class="field">
        <label>Name</label>
        <input type="text" id="loginUsername" placeholder="admin" value="admin">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" value="admin123">
      </div>
      <button class="btn" id="loginBtn">Enter</button>
      <div class="error-msg" id="loginError"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
